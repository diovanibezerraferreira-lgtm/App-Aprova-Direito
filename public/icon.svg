<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F284D" />
      <stop offset="100%" stop-color="#08162B" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9E076" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A27907" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer subtle gold border -->
  <rect x="12" y="12" width="488" height="488" rx="94" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="3" />

  <!-- Scale of Justice / Balança da Justiça -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Top Spire -->
    <path d="M 256 86 L 268 108 L 244 108 Z" fill="url(#gold)" />
    <circle cx="256" cy="116" r="14" fill="url(#gold)" />
    <circle cx="256" cy="116" r="6" fill="#FFF3B0" />
    
    <!-- Central Column -->
    <rect x="250" y="122" width="12" height="236" rx="6" fill="url(#gold)" />

    <!-- Horizontal Balance Beam -->
    <path d="M 124 162 C 180 156, 332 156, 388 162 C 393 162, 394 167, 390 170 C 334 176, 178 176, 122 170 C 118 167, 119 162, 124 162 Z" fill="url(#gold)" />
    <circle cx="256" cy="166" r="9" fill="#FFF3B0" />
    <circle cx="132" cy="167" r="6" fill="#FFF3B0" />
    <circle cx="380" cy="167" r="6" fill="#FFF3B0" />

    <!-- Left Strings -->
    <line x1="132" y1="168" x2="94" y2="258" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    <line x1="132" y1="168" x2="170" y2="258" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />

    <!-- Left Pan -->
    <path d="M 84 258 Q 132 290 180 258 Z" fill="url(#gold)" />
    <line x1="84" y1="258" x2="180" y2="258" stroke="#FFF3B0" stroke-width="3" stroke-linecap="round" />

    <!-- Right Strings -->
    <line x1="380" y1="168" x2="342" y2="258" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    <line x1="380" y1="168" x2="418" y2="258" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />

    <!-- Right Pan -->
    <path d="M 332 258 Q 380 290 428 258 Z" fill="url(#gold)" />
    <line x1="332" y1="258" x2="428" y2="258" stroke="#FFF3B0" stroke-width="3" stroke-linecap="round" />

    <!-- Pillar Base / Pedestal -->
    <path d="M 224 354 L 288 354 L 306 390 L 206 390 Z" fill="url(#gold)" />
    <rect x="190" y="390" width="132" height="22" rx="6" fill="url(#gold)" />
    <line x1="198" y1="392" x2="314" y2="392" stroke="#FFF3B0" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
